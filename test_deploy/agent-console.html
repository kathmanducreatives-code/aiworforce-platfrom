<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerDialer — Agent Console</title>
    <script src="https://sdk.twilio.com/js/client/releases/2.3.1/twilio.min.js"></script>
    <meta name="description" content="Real-time cold calling agent console powered by Twilio Voice SDK">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
        rel="stylesheet">
    <style>
        /* ── Reset ───────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --bg: #ffffff;
            --bg-panel: #f7f8fa;
            --bg-hover: #f0f2f5;
            --bg-active: #edf1fb;
            --border: #e3e6ec;
            --text: #111318;
            --text-secondary: #555d6e;
            --text-muted: #8b93a5;
            --accent: #3B6FE8;
            --accent-light: #edf1fb;
            --accent-dark: #2d5bc5;
            --green: #16a34a;
            --green-light: #ecfdf5;
            --green-bg: #dcfce7;
            --red: #dc2626;
            --red-light: #fef2f2;
            --red-bg: #fee2e2;
            --amber: #d97706;
            --amber-bg: #fef3c7;
            --gray: #6b7280;
            --gray-bg: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.08);
            --radius: 10px;
            --radius-sm: 6px;
            --radius-lg: 14px;
            --transition: 0.2s ease;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── App Shell ────────────────────────────────────────────── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 1024px;
        }

        /* ── Header ──────────────────────────────────────────────── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 54px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.3px;
        }

        .header-logo svg {
            width: 20px;
            height: 20px;
            color: var(--accent);
        }

        .header-divider {
            width: 1px;
            height: 18px;
            background: var(--border);
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .softphone-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 5px 14px;
            background: var(--bg-panel);
            border-radius: 100px;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gray);
            transition: background var(--transition);
            flex-shrink: 0;
        }

        .status-dot.ready {
            background: var(--green);
        }

        .status-dot.connecting {
            background: var(--amber);
            animation: pulse 1.4s ease infinite;
        }

        .status-dot.error {
            background: var(--red);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        /* ── Error Banner ────────────────────────────────────────── */
        .error-banner {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 9px 24px;
            background: var(--red-bg);
            color: var(--red);
            font-size: 13px;
            font-weight: 500;
            border-bottom: 1px solid #fecaca;
            flex-shrink: 0;
        }

        .error-banner.visible {
            display: flex;
        }

        .error-banner svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .error-banner-close {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--red);
            cursor: pointer;
            padding: 4px;
            font-size: 18px;
            line-height: 1;
        }

        /* ── Main Layout ─────────────────────────────────────────── */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-left {
            width: 30%;
            border-right: 1px solid var(--border);
        }

        .panel-center {
            width: 40%;
            background: var(--bg);
        }

        .panel-right {
            width: 30%;
            border-left: 1px solid var(--border);
        }

        .panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .panel-count {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-hover);
            padding: 2px 8px;
            border-radius: 100px;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .panel-body::-webkit-scrollbar {
            width: 4px;
        }

        .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .panel-body::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ── Lead Queue ──────────────────────────────────────────── */
        .lead-queue-error {
            display: none;
            padding: 32px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .lead-queue-error.visible {
            display: block;
        }

        .lead-queue-error svg {
            width: 22px;
            height: 22px;
            margin: 0 auto 10px;
            display: block;
            opacity: 0.45;
        }

        .lead-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 20px;
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
            cursor: default;
            position: relative;
        }

        .lead-item:hover {
            background: var(--bg-hover);
        }

        .lead-item.active {
            background: var(--accent-light);
            border-left: 3px solid var(--accent);
            padding-left: 17px;
        }

        .lead-item.active .lead-index {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 111, 232, 0.15);
        }

        .lead-item.completed {
            opacity: 0.5;
        }

        .lead-item.completed .lead-index {
            background: var(--green-bg);
            color: var(--green);
        }

        .lead-item.completed.outcome-bad .lead-index {
            background: var(--gray-bg);
            color: var(--gray);
        }

        .lead-item.completed.outcome-failed .lead-index {
            background: var(--red-bg);
            color: var(--red);
        }

        .lead-index {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: all var(--transition);
        }

        .lead-info {
            flex: 1;
            min-width: 0;
        }

        .lead-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lead-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lead-phone {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
            font-variant-numeric: tabular-nums;
        }

        .lead-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 3px 8px;
            border-radius: 100px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        .badge-pending {
            background: var(--bg-hover);
            color: var(--text-muted);
        }

        .badge-dialing {
            background: var(--accent-light);
            color: var(--accent);
        }

        .badge-answered {
            background: var(--green-bg);
            color: var(--green);
        }

        .badge-voicemail {
            background: var(--gray-bg);
            color: var(--gray);
        }

        .badge-busy {
            background: var(--amber-bg);
            color: var(--amber);
        }

        .badge-noanswer {
            background: var(--gray-bg);
            color: var(--gray);
        }

        .badge-failed {
            background: var(--red-bg);
            color: var(--red);
        }

        .badge-canceled {
            background: var(--gray-bg);
            color: var(--gray);
        }

        /* dialing pulse */
        .lead-item.active .lead-badge {
            animation: badgePulse 2s ease infinite;
        }

        @keyframes badgePulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* ── Center Panel — Active Call ──────────────────────────── */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 32px;
            text-align: center;
        }

        /* idle */
        .idle-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .idle-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .idle-icon svg {
            width: 28px;
            height: 28px;
            color: var(--text-muted);
        }

        .idle-text {
            font-size: 17px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .idle-sub {
            font-size: 13px;
            color: var(--text-muted);
            opacity: 0.65;
        }

        .btn-start-dialer {
            margin-top: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 28px;
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            border: 1.5px solid var(--accent);
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 2px 12px rgba(59, 111, 232, 0.25);
        }

        .btn-start-dialer:hover {
            background: var(--accent-dark);
            box-shadow: 0 4px 18px rgba(59, 111, 232, 0.35);
            transform: translateY(-1px);
        }

        .btn-start-dialer:active {
            transform: translateY(0);
        }

        .btn-start-dialer:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-start-dialer svg {
            width: 18px;
            height: 18px;
        }

        /* active call */
        .call-display {
            display: none;
            width: 100%;
        }

        .call-display.visible {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .call-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6b9afc, var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 18px;
            box-shadow: 0 4px 20px rgba(59, 111, 232, 0.2);
            letter-spacing: -0.5px;
        }

        .call-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .call-company {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
        }

        .call-phone {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
        }

        .call-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            padding: 5px 16px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: background var(--transition), color var(--transition);
        }

        .call-status-badge .pulse-ring {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .call-status-badge.waiting {
            background: var(--bg-hover);
            color: var(--text-muted);
        }

        .call-status-badge.dialing {
            background: var(--accent-light);
            color: var(--accent);
        }

        .call-status-badge.ringing {
            background: var(--amber-bg);
            color: var(--amber);
        }

        .call-status-badge.connected {
            background: var(--green-bg);
            color: var(--green);
        }

        .call-status-badge.ended {
            background: var(--gray-bg);
            color: var(--gray);
        }

        .call-timer {
            font-size: 38px;
            font-weight: 700;
            color: var(--text);
            margin-top: 22px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: opacity var(--transition);
        }

        .call-timer.visible {
            opacity: 1;
            height: auto;
        }

        .call-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 26px;
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            outline: none;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn:not(:disabled):hover {
            transform: translateY(-1px);
        }

        .btn:not(:disabled):active {
            transform: translateY(0);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-accept {
            background: var(--green);
            color: #fff;
            box-shadow: 0 2px 12px rgba(22, 163, 74, 0.25);
        }

        .btn-accept:not(:disabled):hover {
            background: #15803d;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.35);
        }

        .btn-hangup {
            background: var(--red);
            color: #fff;
            box-shadow: 0 2px 12px rgba(220, 38, 38, 0.25);
        }

        .btn-hangup:not(:disabled):hover {
            background: #b91c1c;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.35);
        }

        /* ── Right Panel — Stats + History ───────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .stat-card {
            padding: 10px 8px;
            background: var(--bg-panel);
            border-radius: var(--radius-sm);
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-card.wide {
            grid-column: span 3;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.1;
        }

        .stat-value.accent {
            color: var(--accent);
        }

        .stat-value.green {
            color: var(--green);
        }

        .stat-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }

        .history-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .history-empty svg {
            width: 28px;
            height: 28px;
            margin-bottom: 10px;
            opacity: 0.35;
        }

        .history-empty-text {
            font-size: 13px;
            font-weight: 500;
        }

        .history-item {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }

        .history-item:hover {
            background: var(--bg-hover);
        }

        .history-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .history-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-outcome {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 2px 8px;
            border-radius: 100px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .outcome-answered {
            background: var(--green-bg);
            color: var(--green);
        }

        .outcome-voicemail {
            background: var(--gray-bg);
            color: var(--gray);
        }

        .outcome-busy {
            background: var(--amber-bg);
            color: var(--amber);
        }

        .outcome-noanswer {
            background: var(--gray-bg);
            color: var(--gray);
        }

        .outcome-failed {
            background: var(--red-bg);
            color: var(--red);
        }

        .outcome-canceled {
            background: var(--gray-bg);
            color: var(--gray);
        }

        .history-detail {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .history-detail span+span::before {
            content: '·';
            margin-right: 6px;
        }

        /* ── Dev Console ─────────────────────────────────────────── */
        .dev-console {
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg-panel);
        }

        .dev-console-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            padding: 5px 24px;
            font-family: var(--font);
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dev-console-toggle svg {
            width: 11px;
            height: 11px;
            transition: transform var(--transition);
        }

        .dev-console-toggle.open svg {
            transform: rotate(180deg);
        }

        .dev-console-body {
            display: none;
            max-height: 130px;
            overflow-y: auto;
            padding: 6px 24px 10px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .dev-console-body.open {
            display: block;
        }

        .dev-console-body::-webkit-scrollbar {
            width: 4px;
        }

        .dev-console-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .dev-console-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .log-entry {
            padding: 1px 0;
        }

        .log-entry.error {
            color: var(--red);
        }

        .log-entry.warn {
            color: var(--amber);
        }

        .log-entry.info {
            color: var(--accent);
        }

        /* ── Animations ──────────────────────────────────────────── */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lead-item {
            animation: fadeIn 0.15s ease;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- ── Header ──────────────────────────────────────────── -->
        <header class="header">
            <div class="header-left">
                <div class="header-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                    </svg>
                    PowerDialer
                </div>
                <div class="header-divider"></div>
                <span class="header-subtitle">Agent Console</span>
            </div>

        </header>

        <!-- ── Error Banner ────────────────────────────────────── -->
        <div class="error-banner" id="errorBanner">

                onclick="document.getElementById('errorBanner').classList.remove('visible')">&times;</button>
        </div>

        <!-- ── Main Layout ─────────────────────────────────────── -->
        <div class="main">
            <!-- Left — Lead Queue -->
            <div class="panel panel-left">
                <div class="panel-header">
                    <div class="panel-title">Lead Queue</div>
                    <div class="panel-count" id="leadCount">0</div>

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                        Could not load leads
                    </div>
                    <div id="leadQueueList"></div>
                </div>
            </div>

            <!-- Center — Active Call -->
            <div class="panel panel-center">
                <div class="center-content">
                    <!-- Idle State -->
                    <div class="idle-state" id="idleState">
                        <div class="idle-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                            </svg>
                        </div>
                        <div class="idle-text">Waiting for next lead…</div>
                        <div class="idle-sub" id="idleSub">Softphone initializing</div>
                        <button class="btn-start-dialer" id="btnStartDialer" onclick="startDialer()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            Start Dialer
                        </button>
                    </div>

                    <!-- Active Call Display -->
                    <div class="call-display" id="callDisplay">
                        <div class="call-avatar" id="callAvatar">?</div>
                        <div class="call-name" id="callName"></div>
                        <div class="call-company" id="callCompany"></div>
                        <div class="call-phone" id="callPhone"></div>
                        <div class="call-status-badge waiting" id="callStatusBadge">
                            <span class="pulse-ring"></span>

                                    <path
                                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                                </svg>
                                Accept
                            </button>
                            <button class="btn btn-hangup" id="btnHangup" disabled onclick="hangupCall()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.11 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91" />
                                    <line x1="23" y1="1" x2="1" y2="23" />
                                </svg>
                                Hang Up
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right — Session Stats + History -->
            <div class="panel panel-right">
                <div class="panel-header">
                    <div class="panel-title">Session</div>
                </div>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-value" id="statTotal">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value green" id="statAnswered">0</div>
                        <div class="stat-label">Answered</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value accent" id="statRate">0%</div>
                        <div class="stat-label">Connect Rate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statVM">0</div>
                        <div class="stat-label">Voicemail</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statBusy">0</div>
                        <div class="stat-label">Busy / NA</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statFailed">0</div>
                        <div class="stat-label">Failed</div>
                    </div>

                <div class="panel-body" id="historyBody">
                    <div class="history-empty" id="historyEmpty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
                            <path
                                d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
                        </svg>
                        <div class="history-empty-text">No calls yet this session</div>
                    </div>
                    <div id="historyList"></div>
                </div>
            </div>

        <!-- ── Dev Console ─────────────────────────────────────── -->
        <div class="dev-console">
            <button class="dev-console-toggle" id="devToggle" onclick="toggleDevConsole()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9" />
                </svg>
                Dev Console
            </button>
            <div class="dev-console-body" id="devConsoleBody"></div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        //  CONFIG — change these to match your backend
        // ═══════════════════════════════════════════════════════════════
        const CONFIG = {
            BASE_URL: 'https://n8n.prasidha.me',
            TOKEN_PATH: '/webhook/softphone-token',
            LEADS_PATH: '/webhook/get-leads',
            START_PATH: '/webhook/power-dialer-start',
            DIALER_SECRET: 'my-secret-123',
            POLL_INTERVAL: 3000
        };

        // ═══════════════════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════════════════
        let twilioDevice = null;
        let activeCall = null;
        let currentLeads = [];
        let callHistory = [];
        let callTimerInterval = null;
        let callStartTime = null;
        let pollInterval = null;
        let dialerRunning = false;
        let currentCallStatus = 'idle'; // idle | dialing | ringing | connected | ended

        // ═══════════════════════════════════════════════════════════════
        //  DOM REFS
        // ═══════════════════════════════════════════════════════════════
        const $ = (id) => document.getElementById(id);

        // ═══════════════════════════════════════════════════════════════
        //  LOGGING
        // ═══════════════════════════════════════════════════════════════
        function devLog(msg, level = 'info') {
            const body = $('devConsoleBody');
            const time = new Date().toLocaleTimeString();
            const el = document.createElement('div');
            el.className = `log-entry ${level}`;
            el.textContent = `[${time}] ${msg}`;
            body.insertBefore(el, body.firstChild);
            while (body.children.length > 200) body.removeChild(body.lastChild);
            if (level === 'error') console.error('[PowerDialer]', msg);
            else console.log('[PowerDialer]', msg);
        }

        function toggleDevConsole() {
            $('devToggle').classList.toggle('open');
            $('devConsoleBody').classList.toggle('open');
        }

        // ═══════════════════════════════════════════════════════════════
        //  SOFTPHONE STATUS
        // ═══════════════════════════════════════════════════════════════
        function setSoftphoneStatus(state, label) {
            $('statusDot').className = `status-dot ${state}`;
            $('statusText').textContent = label || state.charAt(0).toUpperCase() + state.slice(1);
            if ($('idleState').style.display !== 'none') {
                $('idleSub').textContent = `Softphone ${(label || state).toLowerCase()}`;
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  TWILIO INITIALIZATION
        // ═══════════════════════════════════════════════════════════════
        async function initTwilio() {
            devLog('Fetching softphone token…');
            setSoftphoneStatus('connecting', 'Connecting');

            try {
                const res = await fetch(`${CONFIG.BASE_URL}${CONFIG.TOKEN_PATH}`);
                if (!res.ok) throw new Error(`Token endpoint returned ${res.status}`);

                let token = (await res.text()).trim();
                // Strip leading = if present (n8n sometimes prepends it)
                if (token.startsWith('=')) token = token.substring(1);
                devLog(`Token received (${token.length} chars) — initializing Twilio Device`);

                // Check that Twilio SDK loaded (won't load on file:// protocol)
                if (typeof Twilio === 'undefined') {
                    throw new Error('Twilio SDK not loaded — serve this page via HTTP (not file://)');
                }

                // Use Twilio.Device.setup() as per SDK 1.x / 2.x
                twilioDevice = Twilio.Device.setup(token, {
                    codecPreferences: ['opus', 'pcmu'],
                    enableRingingState: true,
                    debug: false
                });

                Twilio.Device.on('ready', function () {
                    devLog('Twilio Device ready ✓');
                    setSoftphoneStatus('ready', 'Ready');
                    $('errorBanner').classList.remove('visible');
                    $('btnStartDialer').disabled = false;
                });

                Twilio.Device.on('error', function (err) {
                    devLog(`Twilio error: ${err.message || err.code}`, 'error');
                    setSoftphoneStatus('error', 'Error');
                });

                Twilio.Device.on('incoming', function (conn) {
                    devLog(`Incoming call → ${conn.parameters.From || 'unknown'}`);
                    activeCall = conn;
                    handleIncomingCall(conn);
                });

                Twilio.Device.on('disconnect', function (conn) {
                    devLog('Call disconnected');
                    handleCallEnd(conn);
                });

                Twilio.Device.on('cancel', function () {
                    devLog('Incoming call cancelled');
                    handleCallEnd(null);
                });

                Twilio.Device.on('offline', function () {
                    devLog('Device went offline — will refresh token', 'warn');
                    setSoftphoneStatus('connecting', 'Reconnecting');
                    setTimeout(initTwilio, 5000);
                });

            } catch (err) {
                devLog(`Softphone init failed: ${err.message}`, 'error');
                setSoftphoneStatus('error', 'Error');
                $('errorBannerText').textContent = 'Softphone unavailable — check token endpoint';
                $('errorBanner').classList.add('visible');
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  CALL HANDLING
        // ═══════════════════════════════════════════════════════════════
        function handleIncomingCall(conn) {
            const from = conn.parameters.From || '';
            const lead = matchLeadByPhone(from);

            showCallDisplay(lead || { name: from || 'Unknown', company: '', phone: from }, 'ringing');
            $('btnAccept').disabled = false;
            $('btnHangup').disabled = true;

            conn.on('accept', function () {
                devLog('Call accepted — connected');
                setCallStatus('connected');
                $('btnAccept').disabled = true;
                $('btnHangup').disabled = false;
                startCallTimer();
            });

            conn.on('disconnect', function () {
                handleCallEnd(conn);
            });

            conn.on('cancel', function () {
                devLog('Caller cancelled');
                handleCallEnd(null);
            });

            conn.on('reject', function () {
                devLog('Call rejected');
                handleCallEnd(null);
            });
        }

        function handleCallEnd(conn) {
            stopCallTimer();

            const duration = callStartTime ? Math.floor((Date.now() - callStartTime) / 1000) : 0;
            let outcome = 'Ended';
            if (duration > 0) outcome = 'Answered';
            else if (currentCallStatus === 'ringing') outcome = 'No Answer';

            // Add to session history if we were showing a call
            if ($('callDisplay').classList.contains('visible')) {
                addToHistory({
                    name: $('callName').textContent,
                    company: $('callCompany').textContent,
                    phone: $('callPhone').textContent,
                    outcome,
                    time: new Date()
                });
            }

            activeCall = null;
            callStartTime = null;
            currentCallStatus = 'idle';
            hideCallDisplay();
            setSoftphoneStatus('ready', 'Ready');
            $('btnAccept').disabled = true;
            $('btnHangup').disabled = true;
        }

        function acceptCall() {
            if (!activeCall) return;
            devLog('Accepting call…');
            activeCall.accept();
        }

        function hangupCall() {
            if (!activeCall) return;
            devLog('Hanging up…');
            activeCall.disconnect();
        }

        // ═══════════════════════════════════════════════════════════════
        //  START DIALER
        // ═══════════════════════════════════════════════════════════════
        async function startDialer() {
            const btn = $('btnStartDialer');
            btn.disabled = true;
            btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;animation:pulse 1s ease infinite">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        Starting…
      `;
            devLog('Starting dialer…');

            try {
                const res = await fetch(`${CONFIG.BASE_URL}${CONFIG.START_PATH}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-dialer-secret': CONFIG.DIALER_SECRET
                    },
                    body: JSON.stringify({})
                });

                const text = (await res.text()).trim().toLowerCase();
                devLog(`Dialer response: ${text}`);

                if (text.includes('halt') || text.includes('stop')) {
                    devLog('Dialer halted (STOP flag set in sheet)', 'warn');
                    dialerRunning = false;
                    btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            Start Dialer
          `;
                    btn.disabled = false;
                } else if (text.includes('completed') || text.includes('done')) {
                    devLog('All leads completed ✓');
                    dialerRunning = false;
                    btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            All Done
          `;
                } else {
                    dialerRunning = true;
                    btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            Dialer Running
          `;
                    // Auto-refresh leads quickly
                    fetchLeads();
                }
            } catch (err) {
                devLog(`Failed to start dialer: ${err.message}`, 'error');
                btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Start Dialer
        `;
                btn.disabled = false;
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  CALL DISPLAY
        // ═══════════════════════════════════════════════════════════════
        function showCallDisplay(lead, status) {
            $('idleState').style.display = 'none';
            $('callDisplay').classList.add('visible');
            $('callAvatar').textContent = getInitials(lead.name);
            $('callName').textContent = lead.name || 'Unknown';
            $('callCompany').textContent = lead.company || '';
            $('callPhone').textContent = formatPhone(lead.phone);
            setCallStatus(status);
        }

        function hideCallDisplay() {
            $('callDisplay').classList.remove('visible');
            $('idleState').style.display = '';
            $('callTimer').classList.remove('visible');
            $('callTimer').textContent = '00:00';
        }

        function setCallStatus(status) {
            currentCallStatus = status;
            const labels = { waiting: 'WAITING', dialing: 'DIALING', ringing: 'RINGING', connected: 'CONNECTED', ended: 'ENDED' };
            $('callStatusBadge').className = `call-status-badge ${status}`;
            $('callStatusText').textContent = labels[status] || status.toUpperCase();
        }

        // ═══════════════════════════════════════════════════════════════
        //  CALL TIMER
        // ═══════════════════════════════════════════════════════════════
        function startCallTimer() {
            callStartTime = Date.now();
            $('callTimer').classList.add('visible');
            callTimerInterval = setInterval(() => {
                const s = Math.floor((Date.now() - callStartTime) / 1000);
                $('callTimer').textContent =
                    String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
            }, 1000);
        }

        function stopCallTimer() {
            if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
        }

        // ═══════════════════════════════════════════════════════════════
        //  LEADS
        // ═══════════════════════════════════════════════════════════════
        async function fetchLeads() {
            try {
                const res = await fetch(`${CONFIG.BASE_URL}${CONFIG.LEADS_PATH}`, {
                    headers: {
                        'x-dialer-secret': CONFIG.DIALER_SECRET,
                        'Content-Type': 'application/json'
                    }
                });
                if (!res.ok) throw new Error(`${res.status}`);

                const data = await res.json();
                const leads = Array.isArray(data) ? data : (data.leads || []);
                currentLeads = leads;
                renderLeadQueue(leads);
                $('leadQueueError').classList.remove('visible');

                // Auto-detect dialing lead and show in center panel (only if no active Twilio call)
                const dialingLead = leads.find(l => norm(l.status) === 'dialing');
                if (dialingLead && !activeCall && currentCallStatus !== 'connected') {
                    showCallDisplay(dialingLead, 'dialing');
                } else if (!dialingLead && !activeCall && currentCallStatus !== 'connected') {
                    // Check if dialer has finished all leads
                    const allDone = leads.length > 0 && leads.every(l => {
                        const s = norm(l.status);
                        return s && s !== '' && s !== 'dialing';
                    });
                    if (allDone && dialerRunning) {
                        devLog('All leads processed');
                        dialerRunning = false;
                    }
                    if (currentCallStatus !== 'idle') {
                        hideCallDisplay();
                        currentCallStatus = 'idle';
                    }
                }

                // Update session stats from lead data
                updateStatsFromLeads(leads);

            } catch (err) {
                devLog(`Lead fetch failed: ${err.message}`, 'error');
                $('leadQueueError').classList.add('visible');
            }
        }

        function renderLeadQueue(leads) {
            $('leadCount').textContent = leads.length;
            let html = '';

            leads.forEach((lead, i) => {
                const status = norm(lead.status);
                const isActive = status === 'dialing';
                const isCompleted = ['answered', 'voicemail', 'busy', 'no answer', 'failed', 'canceled'].includes(status);

                let cls = 'lead-item';
                if (isActive) cls += ' active';
                if (isCompleted) cls += ' completed';
                if (['failed'].includes(status)) cls += ' outcome-failed';
                if (['voicemail', 'busy', 'no answer', 'canceled'].includes(status)) cls += ' outcome-bad';

                const badgeCls = getBadgeClass(status);
                const indexContent = isCompleted ? '✓' : (i + 1);

                html += `<div class="${cls}" data-i="${i}">
          <div class="lead-index">${indexContent}</div>
          <div class="lead-info">
            <div class="lead-name">${esc(lead.name || 'Unknown')}</div>
            <div class="lead-meta">${esc(lead.company || '')}</div>
            <div class="lead-phone">${formatPhone(lead.phone)}</div>
          </div>
          <div class="lead-badge ${badgeCls}">${esc(statusLabel(status))}</div>
        </div>`;
            });

            $('leadQueueList').innerHTML = html;

            // Auto-scroll to active
            const active = $('leadQueueList').querySelector('.lead-item.active');
            if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function getBadgeClass(status) {
            return ({
                '': 'badge-pending', dialing: 'badge-dialing', answered: 'badge-answered',
                voicemail: 'badge-voicemail', busy: 'badge-busy',
                'no answer': 'badge-noanswer', failed: 'badge-failed', canceled: 'badge-canceled'
            })[status] || 'badge-pending';
        }

        function statusLabel(status) {
            return ({
                '': 'Pending', dialing: 'Dialing', answered: 'Answered',
                voicemail: 'Voicemail', busy: 'Busy',
                'no answer': 'No Answer', failed: 'Failed', canceled: 'Canceled'
            })[status] || (status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Pending');
        }

        // ═══════════════════════════════════════════════════════════════
        //  SESSION STATS & HISTORY
        // ═══════════════════════════════════════════════════════════════
        function updateStatsFromLeads(leads) {
            const completed = leads.filter(l => norm(l.status) !== '' && norm(l.status) !== 'dialing');
            const answered = leads.filter(l => norm(l.status) === 'answered').length;
            const vm = leads.filter(l => norm(l.status) === 'voicemail').length;
            const busyNA = leads.filter(l => ['busy', 'no answer', 'canceled'].includes(norm(l.status))).length;
            const failed = leads.filter(l => norm(l.status) === 'failed').length;
            const total = completed.length;

            $('statTotal').textContent = total;
            $('statAnswered').textContent = answered;
            $('statVM').textContent = vm;
            $('statBusy').textContent = busyNA;
            $('statFailed').textContent = failed;
            $('statRate').textContent = total > 0 ? Math.round((answered / total) * 100) + '%' : '0%';
        }

        function addToHistory(entry) {
            // Avoid duplicates (same phone + outcome within 5s)
            const dupe = callHistory.find(h =>
                h.phone === entry.phone &&
                h.outcome === entry.outcome &&
                Math.abs(h.time - entry.time) < 5000
            );
            if (dupe) return;

            callHistory.unshift(entry);
            renderHistory();
        }

        function renderHistory() {
            if (callHistory.length === 0) {
                $('historyEmpty').style.display = '';
                $('historyList').innerHTML = '';
                return;
            }

            $('historyEmpty').style.display = 'none';

            let html = '';
            callHistory.forEach(e => {
                const cls = getOutcomeClass(e.outcome);
                const t = e.time instanceof Date
                    ? e.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    : e.time;

                html += `<div class="history-item">
          <div class="history-top">
            <div class="history-name">${esc(e.name)}</div>
            <div class="history-outcome ${cls}">${esc(e.outcome)}</div>
          </div>
          <div class="history-detail">
            <span>${esc(e.company || '—')}</span>
            <span>${t}</span>
          </div>
        </div>`;
            });

            $('historyList').innerHTML = html;
        }

        function getOutcomeClass(outcome) {
            const out = (outcome || '').toLowerCase();
            return ({
                answered: 'outcome-answered', voicemail: 'outcome-voicemail',
                busy: 'outcome-busy', 'no answer': 'outcome-noanswer',
                failed: 'outcome-failed', canceled: 'outcome-canceled', ended: 'outcome-noanswer'
            })[out] || 'outcome-noanswer';
        }

        // ═══════════════════════════════════════════════════════════════
        //  HELPERS
        // ═══════════════════════════════════════════════════════════════
        function norm(s) { return (s || '').trim().toLowerCase(); }

        function matchLeadByPhone(phone) {
            const digits = (phone || '').replace(/\D/g, '');
            return currentLeads.find(l => (l.phone || '').replace(/\D/g, '') === digits);
        }

        function formatPhone(phone) {
            if (!phone) return '';
            const d = phone.replace(/\D/g, '');
            if (d.length === 11 && d[0] === '1') return `+1 (${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7)}`;
            if (d.length === 10) return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
            return phone;
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
        }

        function esc(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        // ═══════════════════════════════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════════════════════════════
        async function init() {
            devLog('PowerDialer Agent Console v2.0');

            // Check if Twilio SDK loaded
            if (typeof Twilio === 'undefined') {
                const errorMsg = 'Twilio SDK failed to load. This may be due to browser security settings (CORB) or lack of internet. Please refresh the page.';
                devLog(errorMsg, 'error');
                $('errorBannerText').textContent = errorMsg;
                $('errorBanner').classList.add('visible');
                setSoftphoneStatus('error', 'SDK Error');
                return;
            }

            $('btnStartDialer').disabled = true; // disabled until Twilio is ready

            await fetchLeads();
            pollInterval = setInterval(fetchLeads, CONFIG.POLL_INTERVAL);
            await initTwilio();
        }

        init();
    </script>
</body>
