<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentory — AI Employees for Your Business</title>
  <meta name="description"
    content="Agentory gives your business AI employees that handle your online work — research, leads, signals, content, outreach and recruiting. Give them the job, get the results in one place.">
  <meta name="author" content="Agentory" />
  <link rel="canonical" href="https://agentory.space/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://agentory.space/" />
  <meta property="og:title" content="Agentory — AI Employees for Your Business" />
  <meta property="og:description"
    content="Give Agentory the work. Research, leads, signals, content, outreach and recruiting — handled by AI employees who all know your company." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Agentory — AI Employees for Your Business" />
  <meta name="twitter:description"
    content="Give Agentory the work. Research, leads, signals, content, outreach and recruiting — handled by AI employees who all know your company." />
  <!-- Served from this site (it was a Lovable upload bucket URL). -->
  <link rel="icon" type="image/png" href="/agentory-icon.png">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body style="margin:0;background:#020202;color:#e6e6e6;font-family:DM Sans,system-ui,sans-serif;">
  <div id="root">
    <div id="boot-fallback" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020202;color:#e6e6e6;">
      <div style="text-align:center;max-width:420px;padding:24px;">
        <div style="width:32px;height:32px;border:2px solid #10B981;border-top-color:transparent;border-radius:50%;margin:0 auto 16px;animation:agentory-spin 1s linear infinite;"></div>
        <div id="boot-fallback-msg" style="font-size:14px;opacity:0.85;">Loading Agentory…</div>
        <div id="boot-fallback-actions" style="display:none;margin-top:20px;gap:8px;justify-content:center;">
          <button id="boot-reload" type="button" style="padding:8px 14px;border-radius:8px;border:1px solid #10B981;background:#10B981;color:#020202;font-size:13px;cursor:pointer;">Reload</button>
          <button id="boot-signout" type="button" style="padding:8px 14px;border-radius:8px;border:1px solid #333;background:transparent;color:#e6e6e6;font-size:13px;margin-left:8px;cursor:pointer;">Sign out</button>
        </div>
      </div>
    </div>
  </div>
  <style>@keyframes agentory-spin{to{transform:rotate(360deg)}}</style>
  <!-- Boot watchdog: same-origin file so the CSP needs no inline scripts. -->
  <script src="/boot-watchdog.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
