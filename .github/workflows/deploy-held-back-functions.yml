# DEPLOY A PINNED RELEASE OF THE LEAD V2 EDGE FUNCTIONS — manual, production.
#
# Release cd9ee4b2 — Lead V2 quality Fix Waves 1–3 (PRs #27–#41), the merged
# launch/hardening audited on 2026-10-07. Deployment only: no application file
# changes in this release PR. Measured with `deno info --json` against each
# function's LIVE build (bundled local modules ∩ files changed since that build):
#   orchestrate  228deeac (v114) → 15 of 213 bundled modules changed
#   run-agent    228deeac (v266) → 25 of 359 bundled modules changed (incl. run-agent/index.ts)
#   pilot-chat   721b2180 (v200) → 22 of 224 bundled modules changed (incl. the compiler)
# Deployed in that order, pilot-chat LAST, so Pilot never issues a card under
# the new rules to downstream code still running the old ones.
#
# NOT in this release (their EXECUTED code is unchanged since a08ac0e4):
#   enqueue-lead-mission  7 of 63 bundled modules changed, but every function it
#     runs — index.ts, validateV2KickoffBody, missionFromKickoff,
#     isLeadMissionV1, LEAD_MISSION_VERSION, forceCanaryLeadCount,
#     leadExecutionEngine, serviceRoleAuth, buildStamp — is byte-identical; the
#     changed modules are reached only through leadMission.ts's imports, and
#     add no top-level side effects. Same validation as orchestrate @ cd9ee4b2.
#   approve-and-continue  0 of 5 bundled modules changed.
# Every other function stays on its current build (checked before and after).
# The Railway worker already runs cd9ee4b2 (its /health build.sha, verified
# 2026-10-07; it redeploys itself from launch/hardening).
#
# ROLLBACK: the step "Back up the currently deployed three" downloads the LIVE
# source of orchestrate, run-agent and pilot-chat before anything changes,
# encrypts it with ROLLBACK_ARCHIVE_KEY and uploads it as the artifact
# `pre-deploy-functions-<run_id>` (30 days). To roll back any of the three:
# download the artifact, `openssl enc -d -aes-256-cbc -pbkdf2 -pass
# env:ROLLBACK_ARCHIVE_KEY` it, untar, and `supabase --workdir <dir> functions
# deploy <fn> --project-ref ohsdatpvfdjdemstoiuj --use-docker` per function.
# Nothing here rolls back automatically: a failed step stops the job and prints
# which functions are on which build.
#
# run-agent is too large for Supabase's server-side bundler (HTTP 413), so this
# bundles on the runner with Docker (`--use-docker`).
#
# It deploys ONLY commit RELEASE_SHA, whichever commit this file lives on.
# Secrets: SUPABASE_ACCESS_TOKEN and ROLLBACK_ARCHIVE_KEY from the `production`
# GitHub Environment; OPS_HEALTH_URL, OPS_HEALTH_TOKEN, WORKER_HEALTH_URL (the
# existing ops-health secrets). No provider key; no provider call; no canary.
#
# THIS REPOSITORY IS PUBLIC: logs and artifacts are world-readable. Nothing here
# prints a secret, and the pre-deploy backup is encrypted before upload.
name: Deploy held-back functions (production)

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Type the release SHA to deploy: cd9ee4b2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production-functions
  cancel-in-progress: false

env:
  RELEASE_SHA: cd9ee4b24327c300508800c677331167e08ae417
  # The release every function NOT in this deploy still runs; the preflight
  # proves the build check works by reading one of them back.
  PREVIOUS_RELEASE_SHA: a08ac0e4edea6f3aa54314db4efe0073e371b82f
  # What the three deployed functions run BEFORE this deploy. The preflight
  # refuses if any of them has moved, so this never overwrites a build nobody
  # backed up on purpose.
  LIVE_ORCHESTRATE_SHA: 228deeac73b49ee0b908da9daf248459b9653abd
  LIVE_ORCHESTRATE_VERSION: "114"
  LIVE_RUN_AGENT_SHA: 228deeac73b49ee0b908da9daf248459b9653abd
  LIVE_RUN_AGENT_VERSION: "266"
  LIVE_PILOT_CHAT_SHA: 721b218057b58d4ca12dc6e3e7a6c7e3e05d036a
  LIVE_PILOT_CHAT_VERSION: "200"
  DEPLOYED_FUNCTIONS: "orchestrate run-agent pilot-chat"
  # Lead-path functions this deploy must NOT touch, with the build each runs.
  UNTOUCHED_ON_PREVIOUS: "enqueue-lead-mission continue-workflow resume-stalled-leads ops-health approve-and-continue send-scheduled-emails"
  PROJECT_REF: ohsdatpvfdjdemstoiuj
  SUPABASE_URL: https://ohsdatpvfdjdemstoiuj.supabase.co

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Confirm the release SHA
        env:
          CONFIRM: ${{ inputs.confirm_sha }}
        run: |
          if [ "$CONFIRM" != "cd9ee4b2" ]; then echo "::error::confirm_sha must be cd9ee4b2"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: cd9ee4b24327c300508800c677331167e08ae417
          # Full history, so the ancestry check below is never defeated by a
          # shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checkout is exactly the release commit, and it is on launch/hardening
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          git cat-file -e "$RELEASE_SHA^{commit}"
          # The release must be the merged, CI-tested launch/hardening history,
          # never a commit that only exists on some other branch.
          git fetch --no-tags --quiet origin launch/hardening
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD \
            || { echo "::error::$RELEASE_SHA is not on launch/hardening"; exit 1; }
          echo "checked out $RELEASE_SHA, clean, on launch/hardening"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Write the build verifier
        run: |
          cat > "$RUNNER_TEMP/expect-build.sh" <<'EOF'
          #!/usr/bin/env bash
          # expect-build.sh <function> [sha]: its x-agentory-build header must name
          # the sha (default RELEASE_SHA).
          set -uo pipefail
          fn="$1"
          want="${2:-$RELEASE_SHA}"
          for i in $(seq 1 20); do
            got="$(curl -sS -o /dev/null -D - -X OPTIONS "$SUPABASE_URL/functions/v1/$fn" \
              -H 'Origin: https://agentory.invalid' -H 'Access-Control-Request-Method: POST' \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="x-agentory-build"{print $2}')"
            case "$got" in "$want@"*) echo "$fn: $got"; exit 0 ;; esac
            echo "$fn: attempt $i saw '${got:-no header}', retrying"
            sleep 6
          done
          echo "::error::$fn does not report $want"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/expect-build.sh"

      - name: Preflight — verification works, the live builds are the expected ones, JWT is on
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # A function this deploy does not touch must read back as the previous
          # release, or the post-deploy checks below could not prove anything.
          "$RUNNER_TEMP/expect-build.sh" enqueue-lead-mission "$PREVIOUS_RELEASE_SHA"
          # The three about to be replaced must be EXACTLY what was measured and
          # is about to be backed up: build stamp, version number, JWT on.
          # Only `.version` and `.verify_jwt` are read from the Management API.
          check_live() {
            fn="$1"; sha="$2"; version="$3"
            "$RUNNER_TEMP/expect-build.sh" "$fn" "$sha"
            meta="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$fn" | jq -c '{version, verify_jwt}')"
            echo "$meta" | jq -e '.verify_jwt == true' > /dev/null \
              || { echo "::error::$fn does not currently have verify_jwt=true"; exit 1; }
            echo "$meta" | jq -e --arg v "$version" '(.version | tostring) == $v' > /dev/null \
              || { echo "::error::$fn is not on the expected version v$version: $meta"; exit 1; }
            echo "$fn: v$version, verify_jwt=true (before)"
          }
          check_live orchestrate "$LIVE_ORCHESTRATE_SHA" "$LIVE_ORCHESTRATE_VERSION"
          check_live run-agent "$LIVE_RUN_AGENT_SHA" "$LIVE_RUN_AGENT_VERSION"
          check_live pilot-chat "$LIVE_PILOT_CHAT_SHA" "$LIVE_PILOT_CHAT_VERSION"

      - name: Precondition — FIRECRAWL_USD_PER_CREDIT exists (name only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Only the NAME column is kept; no value or digest is printed.
          names="$(supabase secrets list --project-ref "$PROJECT_REF" | awk -F'|' '{gsub(/[[:space:]]/, "", $1); print $1}')"
          if printf '%s\n' "$names" | grep -qx FIRECRAWL_USD_PER_CREDIT; then
            echo "FIRECRAWL_USD_PER_CREDIT: present"
          else
            echo "::error::FIRECRAWL_USD_PER_CREDIT is not set on Supabase — configure it before deploying"
            exit 1
          fi

      - name: Back up the currently deployed three (encrypted)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ROLLBACK_ARCHIVE_KEY: ${{ secrets.ROLLBACK_ARCHIVE_KEY }}
        run: |
          test -n "$ROLLBACK_ARCHIVE_KEY" || { echo "::error::ROLLBACK_ARCHIVE_KEY is not set"; exit 1; }
          # Its own workdir: `functions download` writes supabase/functions/<fn>,
          # which must never land on the release checkout.
          mkdir -p "$RUNNER_TEMP/rollback/supabase"
          cp supabase/config.toml "$RUNNER_TEMP/rollback/supabase/config.toml"
          # Downloaded quietly: the source is encrypted, never echoed to the
          # (public) log.
          for fn in $DEPLOYED_FUNCTIONS; do
            supabase --workdir "$RUNNER_TEMP/rollback" functions download "$fn" --project-ref "$PROJECT_REF" > /dev/null
            find "$RUNNER_TEMP/rollback" -path "*$fn*" -name index.ts | grep -q . \
              || { echo "::error::backup of $fn has no index.ts"; exit 1; }
            echo "$fn: backed up"
          done
          tar -czf - -C "$RUNNER_TEMP/rollback" . \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ROLLBACK_ARCHIVE_KEY -out "$RUNNER_TEMP/pre-deploy-functions.tgz.enc"
          sudo rm -rf "$RUNNER_TEMP/rollback"

      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-functions-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-deploy-functions.tgz.enc
          retention-days: 30
          if-no-files-found: error

      - name: Stamp the build with the release SHA
        run: scripts/deploy/stamp-build.sh stamp

      - name: Deploy orchestrate (1 of 3)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TARGET: production
        run: node scripts/supabase-target.mjs production -- functions deploy orchestrate --use-docker

      - name: Verify orchestrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          "$RUNNER_TEMP/expect-build.sh" orchestrate
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/orchestrate" | jq -e '.verify_jwt == true' > /dev/null
          echo "orchestrate: verify_jwt=true (after)"

      - name: Deploy run-agent (2 of 3)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TARGET: production
        run: node scripts/supabase-target.mjs production -- functions deploy run-agent --use-docker

      - name: Verify run-agent
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          "$RUNNER_TEMP/expect-build.sh" run-agent
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/run-agent" | jq -e '.verify_jwt == true' > /dev/null
          echo "run-agent: verify_jwt=true (after)"

      # LAST: the entry point. Everything it hands work to is already on the release.
      - name: Deploy pilot-chat (3 of 3)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TARGET: production
        run: node scripts/supabase-target.mjs production -- functions deploy pilot-chat --use-docker

      - name: Verify pilot-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          "$RUNNER_TEMP/expect-build.sh" pilot-chat
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/pilot-chat" | jq -e '.verify_jwt == true' > /dev/null
          echo "pilot-chat: verify_jwt=true (after)"

      - name: Untouched functions are still on their existing build
        run: |
          for fn in $UNTOUCHED_ON_PREVIOUS; do
            "$RUNNER_TEMP/expect-build.sh" "$fn" "$PREVIOUS_RELEASE_SHA"
          done

      - name: Production SHA report
        env:
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: |
          AGENTORY_API_URL="${WORKER_HEALTH_URL%/health}" scripts/deploy/production-shas.sh

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2

      - name: Queue state (Lead V2) — nothing stuck, nothing unclaimed
        env:
          OPS_HEALTH_URL: ${{ secrets.OPS_HEALTH_URL }}
          OPS_HEALTH_TOKEN: ${{ secrets.OPS_HEALTH_TOKEN }}
        run: |
          # Only the queue counters are printed; the token is sent as a header
          # and never echoed.
          queue="$(curl -fsS -H "x-ops-token: $OPS_HEALTH_TOKEN" "$OPS_HEALTH_URL" | jq -c '.snapshot.queue')"
          echo "queue: $queue"
          echo "$queue" | jq -e '.stuck_running == 0 and .unclaimed_waiting == 0' > /dev/null \
            || { echo "::error::the Lead V2 queue has stuck or unclaimed missions"; exit 1; }

      - name: Ops health and Railway worker health (fails on warnings too)
        env:
          OPS_HEALTH_URL: ${{ secrets.OPS_HEALTH_URL }}
          OPS_HEALTH_TOKEN: ${{ secrets.OPS_HEALTH_TOKEN }}
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: deno run --allow-net --allow-env scripts/ops/check-health.ts --fail-on warn

      - name: On failure — where every function stands (no automatic rollback)
        if: failure()
        env:
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: |
          AGENTORY_API_URL="${WORKER_HEALTH_URL%/health}" scripts/deploy/production-shas.sh || true
          echo "::warning::Deploy stopped. Functions above that report $RELEASE_SHA were deployed; the rest were not."
          echo "::warning::Roll back from artifact pre-deploy-functions-${{ github.run_id }} (see the header of this workflow)."
