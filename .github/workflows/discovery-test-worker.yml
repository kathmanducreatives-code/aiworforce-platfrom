# ACTIVE, MANUAL DISPATCH ONLY. Nothing starts it but a person.
#
# Its only trigger is workflow_dispatch: no push, schedule or pull request ever
# runs it. A dispatch then waits for the `discovery-test` Environment's
# required reviewer before any secret is read. tests/infra/testWorkerProposal.test.ts
# checks the guards below and that no other workflow carries them. Dispatching
# it is a separate, explicitly approved step (docs/launch/discovery-smoke-runbook.md,
# Phase 5); with no authorized mission in the queue the worker buys nothing.
#
# What it does: run ONE LeadMission V2 worker for ONE
# bounded session against a NON-PRODUCTION Supabase project, for ONE allowlisted
# test workspace, then drain and exit. It claims at most what the queue offers.
# It never deploys anything, never applies a migration, and never reads a
# production secret: every secret comes from the `discovery-test` Environment,
# which must hold the test project's values only.
#
# THE FIRST REAL-APIFY CANARY (input `canary_stage`, docs/demo/FIRST_APIFY_CANARY.md)
# runs through this same workflow, Environment, reviewer, refusal step and
# concurrency group — never a parallel path. `none` (the default) is the worker
# exactly as before. Each other stage is one operation, run by
# scripts/test-project/canary/canary-stage.sh against the isolated project
# tlvnfrxzjhsjgdofwehb and the canary workspace only, and every operation that
# writes or spends needs its own exact approval phrase (`canary_approval`):
#   verify     read-only and free (Apify account and prices, identity, migration
#              state, conflicts, preflight, an offline kickoff validated)
#   migrate    applies ONLY the reviewed read-cap migration         (DB write)
#   prepare    the kickoff compile (≈ $0.006) and the PAID kickoff SQL,
#              validated and saved as an artifact, NOT executed        (paid)
#   launch     the worker job: executes the prepared kickoff (its sha256 is the
#              approval) seconds before the worker step, inside the
#              authorization's 300 s window              (DB write + paid run)
#   reconcile  read-only post-run checks and the reconciliation SQL to review
#   session    FAST CANARY MODE, one approval for one bounded session in the
#              worker job: verify, compile, validate K01–K20, check the plan
#              against the approved contract (docs/launch/proposals/canary-
#              session-contract.json) S01–S17, and only then — if the contract
#              authorizes automatic execution — kickoff, the existing worker
#              step, stop, reconcile against Apify's receipts, one report.
#              Approval phrase: "run canary session <contract sha256> at <sha>".
# Each stage saves its non-secret audit as an artifact. The `migrate` and
# `launch` stages also need the Environment secret TEST_DB_URL: the isolated
# project's administrator connection (authorize_discovery_smoke is not granted
# to the service role).

name: Discovery test worker (non-production, manual)
# The stage is part of every run's title: the canary budget counts earlier
# `prepare` runs by it (each may have spent its kickoff compile).
run-name: "Discovery test worker — ${{ inputs.canary_stage || 'none' }} @ ${{ inputs.expected_sha }}"

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the NON-production Supabase project ref this run targets"
        required: true
        type: string
      session_minutes:
        description: "Worker session length before it is asked to drain (max 25)"
        required: true
        default: "5"
        type: string
      providers:
        description: "openai-only = zero-Apify (Apify unreachable, no token). none = providers-off rehearsal (no model or Apify key; both hosts denied). openai-and-apify only for the separately approved paid A7"
        required: true
        default: openai-only
        type: choice
        options:
          - openai-only
          - none
          - openai-and-apify
      expected_sha:
        description: "The full 40-character commit SHA approved for this run; the job refuses any other checkout"
        required: true
        type: string
      canary_stage:
        description: "none = the worker as always. Canary: verify (read-only) | migrate | prepare (paid compile) | launch (kickoff + paid run) | reconcile (read-only) | session (one approved contract, end to end) | evidence (read-only: proposes NO_RUN reconciliations, writes nothing)"
        required: true
        default: none
        type: choice
        options:
          - none
          - verify
          - migrate
          - prepare
          - launch
          - reconcile
          - session
          - evidence
      canary_approval:
        description: "Canary stages that write or spend: the exact approval phrase the stage names (see the runbook)"
        required: false
        default: ""
        type: string
      canary_approver:
        description: "prepare: who approved the paid canary (written into the kickoff SQL)"
        required: false
        default: ""
        type: string
      apify_username:
        description: "prepare/launch: the canary Apify account's username (confirmed, never assumed)"
        required: false
        default: ""
        type: string
      kickoff_run_id:
        description: "launch: the id of the prepare run whose kickoff artifact is executed"
        required: false
        default: ""
        type: string
      kickoff_sha256:
        description: "launch: the approved kickoff.sql sha256 (printed by prepare)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One worker at a time, ever. A second dispatch waits; it never runs beside one.
concurrency:
  group: discovery-test-worker
  cancel-in-progress: false

jobs:
  worker:
    # The worker, as always — and the canary's launch, whose kickoff must run
    # seconds before the worker step (the authorization's window is 300 s).
    if: ${{ !contains(fromJSON('["verify","migrate","prepare","reconcile","evidence"]'), inputs.canary_stage) }}
    runs-on: ubuntu-latest
    # actions: read lets launch download the prepare run's kickoff artifact.
    permissions:
      contents: read
      actions: read
    # Holds ONLY the test project's secrets, behind a required reviewer.
    environment: discovery-test
    # Session (<= 25 min) + drain of one slice (LEAD_WORKER_MAX_RUNTIME_MS, 2.5 min)
    # + kill grace (10 min) fits inside this, so GitHub never SIGKILLs a mission mid-run.
    timeout-minutes: 45
    env:
      CONFIRM_REF: ${{ inputs.confirm_project_ref }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      PROVIDERS: ${{ inputs.providers }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      TEST_PROJECT_REF: ${{ vars.TEST_PROJECT_REF }}
      CANARY_STAGE: ${{ inputs.canary_stage }}
      CANARY_APPROVAL: ${{ inputs.canary_approval }}
      CANARY_APPROVER: ${{ inputs.canary_approver }}
      APIFY_USERNAME: ${{ inputs.apify_username }}
      KICKOFF_RUN_ID: ${{ inputs.kickoff_run_id }}
      KICKOFF_SHA256: ${{ inputs.kickoff_sha256 }}
      # NO SECRET AT JOB LEVEL. A job-level secret reaches every step, including
      # the third-party actions below; each secret is set on the one step that
      # reads it (the guard: the URL only; the worker: all five).
      # ── The V2 gate: exactly one test workspace ──────────────────────────
      LEAD_V2_WORKER_WORKSPACES: ${{ vars.TEST_WORKSPACE_ID }}
      # ── Fail-closed spend controls ───────────────────────────────────────
      LEAD_CREDIT_ENFORCEMENT: enforce
      LINEAGE_LEASE_ENFORCED: "true"
      # Durable admission (supabase/migrations-held/20261015140000_…): every paid
      # request needs a committed admission against the queue row's authorization.
      DISCOVERY_SMOKE_ADMISSION: enforce
      # One fixed 300 s mission deadline from the queue row's created_at, across
      # slices and restarts (worker/leadMissionRunner.ts, missionWallClock.ts).
      LEAD_V2_SMOKE_WALL_CLOCK: enforce
      # The smoke's reduced orchestration (four model attempts: execution plan,
      # batch evaluation, mission evaluation, opportunity reasoning). Honoured
      # only while the admission gate is the transport (smokeAdmissionRefusal.ts);
      # without it the customer orchestration needs more attempts than the four.
      LEAD_V2_SMOKE_ORCHESTRATION: minimal
      # The gate refuses the Lovable AI gateway (no approved template), and the
      # strategist defaults to it. OpenAI is the strategist the smoke can price.
      LEAD_STRATEGIST_PROVIDER: openai
      # #89's smoke limits (tests/replay/evaluation/smoke-mission.proposed.json).
      LEAD_V2_MISSION_PROVIDER_USD_CAP: "0.20"   # provider USD, checked before every paid call
      LEAD_V2_MISSION_CREDIT_CAP: "5"            # paid provider calls (1 credit each) = 5 purchases
      LEAD_MAX_AUTO_CONTINUATIONS: "1"           # at most 2 slices
      MODEL_SPEND_ENFORCEMENT: enforce
      MODEL_SPEND_CEILING_USD: "0.05"            # recorded model spend; the last call may overshoot by its own cost
      MODEL_SPEND_PERIOD_DAYS: "1"
      MODEL_RUN_MAX_CALLS: "2"                   # per slice, so at most 4 per mission
      # ── Worker bounds ────────────────────────────────────────────────────
      LEAD_WORKER_MAX_RUNTIME_MS: "150000"       # per slice; 2 slices fit in #89's 300 s
    steps:
      - name: Refuse anything but the confirmed non-production project
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          set -euo pipefail
          # The live project and the abandoned former one are never a test target.
          case "$CONFIRM_REF" in
            ""|ohsdatpvfdjdemstoiuj|wqnigjhcwjxtmordrwno)
              echo "refusing: '$CONFIRM_REF' is not a non-production project" >&2; exit 1 ;;
          esac
          [ "$CONFIRM_REF" = "$TEST_PROJECT_REF" ] \
            || { echo "refusing: typed ref does not match the Environment's TEST_PROJECT_REF" >&2; exit 1; }
          [ "$SUPABASE_URL" = "https://$CONFIRM_REF.supabase.co" ] \
            || { echo "refusing: TEST_SUPABASE_URL does not name the confirmed project" >&2; exit 1; }
          # Keys are not checked here: an `sb_secret_` key does not name its
          # project. The URL above is the guard. A key from another project is
          # rejected by the test project itself, and the worker exits 1.
          # Exactly one workspace on the allowlist.
          [ -n "$LEAD_V2_WORKER_WORKSPACES" ] && [[ "$LEAD_V2_WORKER_WORKSPACES" != *,* ]] \
            && [ "$LEAD_V2_WORKER_WORKSPACES" != "*" ] \
            || { echo "refusing: the allowlist must name exactly one test workspace" >&2; exit 1; }
          [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] && [ "$SESSION_MINUTES" -ge 1 ] && [ "$SESSION_MINUTES" -le 25 ] \
            || { echo "refusing: session_minutes must be 1-25" >&2; exit 1; }
          case "$PROVIDERS" in
            openai-only|none|openai-and-apify) ;;
            *) echo "refusing: providers must be openai-only, none or openai-and-apify" >&2; exit 1 ;;
          esac
          # The approved commit, typed by the dispatcher: a branch that moved
          # after approval never runs (GITHUB_SHA is what checkout fetches).
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$EXPECTED_SHA" = "$GITHUB_SHA" ] \
            || { echo "refusing: this run's commit $GITHUB_SHA is not the approved expected_sha" >&2; exit 1; }
          # THE CANARY LAUNCH: only the isolated canary project and workspace,
          # only a paid dispatch, only a prepared kickoff named by run and sha256.
          case "${CANARY_STAGE:-none}" in
            none) ;;
            launch)
              [ "$CONFIRM_REF" = "tlvnfrxzjhsjgdofwehb" ] \
                || { echo "refusing: the canary runs on tlvnfrxzjhsjgdofwehb only" >&2; exit 1; }
              [ "$LEAD_V2_WORKER_WORKSPACES" = "40e2512f-09b6-433e-97fe-f9999a1f1897" ] \
                || { echo "refusing: the canary runs in the discovery-test workspace only" >&2; exit 1; }
              [ "$PROVIDERS" = "openai-and-apify" ] \
                || { echo "refusing: launch is the paid canary; providers must be openai-and-apify" >&2; exit 1; }
              [[ "$KICKOFF_RUN_ID" =~ ^[0-9]+$ ]] && [[ "$KICKOFF_SHA256" =~ ^[0-9a-f]{64}$ ]] \
                || { echo "refusing: launch needs the prepare run id and the approved kickoff sha256" >&2; exit 1; }
              ;;
            session)
              [ "$CONFIRM_REF" = "tlvnfrxzjhsjgdofwehb" ] \
                || { echo "refusing: the canary runs on tlvnfrxzjhsjgdofwehb only" >&2; exit 1; }
              [ "$LEAD_V2_WORKER_WORKSPACES" = "40e2512f-09b6-433e-97fe-f9999a1f1897" ] \
                || { echo "refusing: the canary runs in the discovery-test workspace only" >&2; exit 1; }
              [ "$PROVIDERS" = "openai-and-apify" ] \
                || { echo "refusing: a session may run the paid canary; providers must be openai-and-apify" >&2; exit 1; }
              [[ "$CANARY_APPROVAL" =~ ^run\ canary\ session\ [0-9a-f]{64}\ at\ [0-9a-f]{40}$ ]] \
                || { echo "refusing: a session needs its approval phrase: run canary session <contract sha256> at <commit sha>" >&2; exit 1; }
              # 8 (session) + 10 (worker) + 10 (kill grace) + 5 (close) + setup fits the job's 45.
              [ "$SESSION_MINUTES" -le 10 ] \
                || { echo "refusing: a session's worker runs at most 10 minutes, so stop and reconcile always fit the job" >&2; exit 1; }
              ;;
            *) echo "refusing: canary stage '$CANARY_STAGE' does not run the worker" >&2; exit 1 ;;
          esac

      # Pinned to full commit SHAs: a moved tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false   # the job's read-only token is not left in .git/config

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed   # v2.0.5
        with:
          deno-version: v2.8.2   # worker/Dockerfile's version

      # Dependencies cached per EXACT commit: only a run of the same approved
      # commit restores them (no deno.json, so the lockfile does not verify a
      # cached module; a commit-scoped key keeps that out of reach).
      - name: Cache Deno dependencies for this commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: ~/.cache/deno
          key: deno-v2.8.2-${{ runner.os }}-${{ github.sha }}

      - name: "Canary launch: the prepare run's kickoff, by run id"
        if: ${{ inputs.canary_stage == 'launch' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: canary-prepare
          path: ${{ runner.temp }}/canary-prepare
          run-id: ${{ inputs.kickoff_run_id }}
          github-token: ${{ github.token }}

      - name: "Canary launch: re-verify, then execute the approved kickoff (the worker starts next)"
        if: ${{ inputs.canary_stage == 'launch' }}
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          APIFY_API_TOKEN: ${{ secrets.TEST_APIFY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export KICKOFF_DIR="$RUNNER_TEMP/canary-prepare/kickoff"
          export CANARY_AUDIT_DIR="$RUNNER_TEMP/canary-audit"
          scripts/test-project/canary/canary-stage.sh launch

      - name: "Canary session: verify, compile, check against the contract, kickoff (the worker starts next)"
        id: session
        if: ${{ inputs.canary_stage == 'session' }}
        timeout-minutes: 8
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          APIFY_API_TOKEN: ${{ secrets.TEST_APIFY_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.TEST_OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CANARY_AUDIT_DIR="$RUNNER_TEMP/canary-audit"
          scripts/test-project/canary/canary-stage.sh session

      - name: One bounded worker session (drains on SIGTERM, then exits)
        # A session runs the worker only after its in-contract kickoff executed.
        if: ${{ inputs.canary_stage != 'session' || steps.session.outputs.kickoff == 'executed' }}
        env:
          # ── Supabase: the TEST project only ──────────────────────────────
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          # ── Providers: test-scoped keys ──────────────────────────────────
          # Only the two vendors the smoke catalog prices. No Firecrawl or
          # Anthropic key: the catalog has no template for either (the gate
          # would refuse them), and the offline rehearsal runs with both absent.
          # A key reaches the step only for a dispatch that may use it: Apify only
          # for openai-and-apify, OpenAI for anything but the providers-off run.
          APIFY_API_TOKEN: ${{ inputs.providers == 'openai-and-apify' && secrets.TEST_APIFY_API_TOKEN || '' }}
          OPENAI_API_KEY: ${{ inputs.providers != 'none' && secrets.TEST_OPENAI_API_KEY || '' }}   # gptProvider and the OpenAI strategist require it
        run: |
          set +e
          # SIGTERM asks the worker to drain: a mission in flight finishes and
          # checkpoints on its own terms (worker/README.md "Shutdown").
          # THIS REPOSITORY IS PUBLIC, and so are its Actions logs. Worker
          # output (company names, provider payloads) goes to a file on the
          # runner, never to the log; only the exit status and a line count are
          # printed. The file is discarded with the runner. Inspect the mission
          # in the test database instead.
          # NETWORK: only the confirmed test project and the two priced vendors.
          # Deno refuses any other host before connecting, so production is
          # unreachable even if the admission gate had a hole; modules load
          # from esm.sh (the worker's only remote import host) under --allow-import.
          # ZERO-APIFY unless the dispatch chose otherwise: the worker gets no
          # Apify token and Deno refuses api.apify.com before connecting,
          # whatever the authorization or the Environment's secrets say. The
          # deny names the port: a bare-host deny does NOT override a
          # host:port allow (tests/infra/testWorkerProposal.test.ts checks
          # the permission itself).
          # PROVIDERS-OFF (none): no model key either, and Deno refuses OpenAI too,
          # so the mission cannot reach any vendor (the rehearsal before any paid run).
          deny=""
          if [ "$PROVIDERS" = "none" ]; then
            unset APIFY_API_TOKEN OPENAI_API_KEY
            deny="--deny-net=api.apify.com:443,api.openai.com:443"
          elif [ "$PROVIDERS" != "openai-and-apify" ]; then
            unset APIFY_API_TOKEN
            deny="--deny-net=api.apify.com:443"
          fi
          echo "providers: $PROVIDERS"
          timeout -s TERM --kill-after=10m "${SESSION_MINUTES}m" \
            deno run --allow-env --allow-read --allow-import=esm.sh:443 \
              --allow-net="$CONFIRM_REF.supabase.co:443,api.apify.com:443,api.openai.com:443" $deny \
              worker/main.ts \
            > "$RUNNER_TEMP/worker.log" 2>&1
          status=$?
          echo "worker exited $status after $(wc -l < "$RUNNER_TEMP/worker.log") log lines (kept off the public log)"
          # 124: the session ended on schedule and the worker drained. Anything
          # else non-zero is a real failure and fails the job.
          [ $status -eq 0 ] || [ $status -eq 124 ] || exit $status

      - name: "Canary launch: post-run checks and the reconciliation to review (read-only)"
        if: ${{ always() && inputs.canary_stage == 'launch' }}
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          APIFY_API_TOKEN: ${{ secrets.TEST_APIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          export CANARY_AUDIT_DIR="$RUNNER_TEMP/canary-audit/post-run"
          export CANARY_QUEUE_ID="$(cat "$RUNNER_TEMP/canary-audit/queue_id" 2>/dev/null || true)"
          [ -n "$CANARY_QUEUE_ID" ] || { echo "no kickoff was executed; nothing to reconcile"; exit 0; }
          scripts/test-project/canary/canary-stage.sh reconcile

      - name: "Canary session: stop, reconcile against Apify's receipts, report"
        if: ${{ always() && inputs.canary_stage == 'session' && steps.session.outputs.kickoff == 'executed' }}
        timeout-minutes: 5
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          APIFY_API_TOKEN: ${{ secrets.TEST_APIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          export CANARY_AUDIT_DIR="$RUNNER_TEMP/canary-audit/close"
          export CANARY_QUEUE_ID="$(cat "$RUNNER_TEMP/canary-audit/queue_id")"
          scripts/test-project/canary/canary-stage.sh session-close

      - name: "Canary session: save the non-secret audit and report"
        if: ${{ always() && inputs.canary_stage == 'session' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: canary-session
          path: ${{ runner.temp }}/canary-audit
          if-no-files-found: ignore
          retention-days: 30

      - name: "Canary launch: save the non-secret audit"
        if: ${{ always() && inputs.canary_stage == 'launch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: canary-launch
          path: ${{ runner.temp }}/canary-audit
          if-no-files-found: ignore
          retention-days: 30

  # ── THE CANARY'S OTHER STAGES: one approved operation each, no worker ───────
  canary:
    if: ${{ contains(fromJSON('["verify","migrate","prepare","reconcile","evidence"]'), inputs.canary_stage) }}
    runs-on: ubuntu-latest
    environment: discovery-test
    timeout-minutes: 20
    # actions: read lets the budget count this workflow's earlier prepare runs.
    permissions:
      contents: read
      actions: read
    env:
      CONFIRM_REF: ${{ inputs.confirm_project_ref }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      TEST_PROJECT_REF: ${{ vars.TEST_PROJECT_REF }}
      TEST_WORKSPACE_ID: ${{ vars.TEST_WORKSPACE_ID }}
      CANARY_STAGE: ${{ inputs.canary_stage }}
      CANARY_APPROVAL: ${{ inputs.canary_approval }}
      CANARY_APPROVER: ${{ inputs.canary_approver }}
      APIFY_USERNAME: ${{ inputs.apify_username }}
    steps:
      - name: Refuse anything but the canary project, workspace and approved commit
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          set -euo pipefail
          case "$CONFIRM_REF" in
            ""|ohsdatpvfdjdemstoiuj|wqnigjhcwjxtmordrwno)
              echo "refusing: '$CONFIRM_REF' is not a non-production project" >&2; exit 1 ;;
          esac
          [ "$CONFIRM_REF" = "tlvnfrxzjhsjgdofwehb" ] \
            || { echo "refusing: the canary runs on tlvnfrxzjhsjgdofwehb only" >&2; exit 1; }
          [ "$CONFIRM_REF" = "$TEST_PROJECT_REF" ] \
            || { echo "refusing: typed ref does not match the Environment's TEST_PROJECT_REF" >&2; exit 1; }
          [ "$SUPABASE_URL" = "https://$CONFIRM_REF.supabase.co" ] \
            || { echo "refusing: TEST_SUPABASE_URL does not name the confirmed project" >&2; exit 1; }
          [ "$TEST_WORKSPACE_ID" = "40e2512f-09b6-433e-97fe-f9999a1f1897" ] \
            || { echo "refusing: the Environment's workspace is not the canary workspace" >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$EXPECTED_SHA" = "$GITHUB_SHA" ] \
            || { echo "refusing: this run's commit $GITHUB_SHA is not the approved expected_sha" >&2; exit 1; }
          case "$CANARY_STAGE" in
            verify|migrate|prepare|reconcile|evidence) ;;
            *) echo "refusing: unknown canary stage" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed   # v2.0.5
        with:
          deno-version: v2.8.2

      - name: Cache Deno dependencies for this commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: ~/.cache/deno
          key: deno-v2.8.2-${{ runner.os }}-${{ github.sha }}

      - name: Canary stage (stops at the first failed check; verify reports every check)
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          APIFY_API_TOKEN: ${{ secrets.TEST_APIFY_API_TOKEN }}
          # Only the paid kickoff compile reads the model key.
          OPENAI_API_KEY: ${{ inputs.canary_stage == 'prepare' && secrets.TEST_OPENAI_API_KEY || '' }}
          # Read-only Actions access: the budget counts earlier prepare runs.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CANARY_AUDIT_DIR="$RUNNER_TEMP/canary-audit"
          scripts/test-project/canary/canary-stage.sh "$CANARY_STAGE"

      - name: Save the non-secret audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: canary-${{ inputs.canary_stage }}
          path: ${{ runner.temp }}/canary-audit
          if-no-files-found: ignore
          retention-days: 30
