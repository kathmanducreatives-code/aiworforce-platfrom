# CI — every suite the repo already has, run on every push and pull request.
#
# Needs NO secrets and touches NO external system: the suites run against fakes
# and a fake network (tests/edge-functions/_helpers/fakeNetwork.ts); the build
# needs no environment. Read-only token.
#
# Existing type and lint debt is held by a RATCHET (scripts/ci/ratchet.mjs):
# nothing may get worse than the committed baseline in scripts/ci/baselines/,
# and a fix lowers it. See docs/launch/ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main, launch/hardening, feat/lead-mission-v2-worker]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version the suites are run with locally.
  DENO_VERSION: v2.8.2
  NODE_VERSION: "22"

jobs:
  backend:
    name: Edge functions, worker, deploy safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true

      # tests/infra runs scripts/verify-deploy-target.mjs, and type-checks with
      # @types/node from node_modules (the repo has a package.json, so Deno
      # resolves types there) — a checkout without `npm ci` fails that suite.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check every edge function and the worker
        # supabase/functions/mcp/index.ts is GENERATED by the Vite build (the
        # Lovable MCP plugin; "do not edit") and is untyped bundled JS, so it is
        # excluded by name. Everything else must type-check with no baseline.
        run: |
          { ls supabase/functions/*/index.ts | grep -v '/mcp/index.ts'; echo worker/main.ts; } | xargs deno check

      - name: Edge function tests
        run: deno test --allow-read --allow-env --no-check tests/edge-functions/

      - name: Deploy-safety tests
        run: deno test --allow-read --allow-env --allow-run tests/infra/

      - name: QA harness tests
        run: |
          deno test --allow-read --allow-env scripts/lead-quality-benchmark/
          deno test --allow-read --allow-env scripts/model-routing-eval/

  frontend:
    name: Frontend build, UI tests, type and lint ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: UI tests (Deno)
        run: npm run test:ui

      - name: UI tests (Node)
        run: npm run test:ui:node

      # BEFORE the build: `vite build` regenerates supabase/functions/mcp/index.ts,
      # and the ratchets judge the files as committed.
      - name: Type ratchet (no new tsc errors)
        run: node scripts/ci/ratchet.mjs tsc

      - name: Lint ratchet (no new eslint errors)
        run: node scripts/ci/ratchet.mjs eslint

      - name: Production build
        run: npm run build
