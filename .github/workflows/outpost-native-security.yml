name: Outpost native identity foundation (not pilot acceptance)
on:
  pull_request:
    paths:
      - '.github/workflows/outpost-native-security.yml'
      - 'tests/outpost-native/**'
      - 'tests/infra/rlsCoversEveryTable.test.ts'
      - 'tests/infra/rlsRelations.test.ts'
      - 'tests/infra/lib/rlsRelations.ts'
      - 'supabase/functions/_shared/pilot/**'
      - 'supabase/functions/pilot-scope/**'
      - 'supabase/functions/pilot-context/**'
      - 'supabase/functions/pilot-import/**'
      - 'tests/edge-functions/pilot*.test.ts'
      - 'supabase/functions/_shared/workspaceAccessGuard.ts'
      - 'supabase/migrations/**'
      - 'supabase/migrations-held/20261022140824_outpost_native_identity_security.sql'
      - 'supabase/migrations-held/20261023061143_outpost_pilot_api_authorization.sql'
      - 'docs/audits/agentory-outbound-outpost-readiness/production-readiness/phase-1/native-access-rollback.sql'
      - 'docs/audits/agentory-outbound-outpost-readiness/production-readiness/native-security-rollback.sql'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  identity-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2
      - name: Pinned offline-contract PostgREST
        env:
          POSTGREST_VERSION: v12.2.3
          POSTGREST_SHA256: 9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c
        run: |
          dir="$RUNNER_TEMP/outpost-postgrest"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/postgrest.tar.xz" "https://github.com/PostgREST/postgrest/releases/download/$POSTGREST_VERSION/postgrest-$POSTGREST_VERSION-linux-static-x64.tar.xz"
          echo "$POSTGREST_SHA256  $dir/postgrest.tar.xz" | sha256sum -c -
          tar -xJf "$dir/postgrest.tar.xz" -C "$dir"
          echo "POSTGREST_BIN=$dir/postgrest" >> "$GITHUB_ENV"
      - name: Native grants, ownership, session predicates, direct API and rollback
        run: tests/outpost-native/run.sh | tee /tmp/outpost-native.log
      - name: Prepare exact owner membership dependency (PR 159, no hosted operation)
        run: |
          git fetch --no-tags --depth=1 origin 572dca5c8d9c7f121731456801a035cfb6186b1e
          git show 572dca5c8d9c7f121731456801a035cfb6186b1e:supabase/migrations/20261022120000_close_workspace_self_join.sql > "$RUNNER_TEMP/outpost-membership-159.sql"
          echo "5fb203974a2f79b8d94f3988aec8807c96fb2dae3de17486ecdd803a33970311  $RUNNER_TEMP/outpost-membership-159.sql" | sha256sum -c -
      - name: Integrated owner membership and pilot API native acceptance
        run: OUTPOST_NATIVE_MEMBERSHIP_SQL="$RUNNER_TEMP/outpost-membership-159.sql" tests/outpost-native/run.sh | tee /tmp/outpost-native-integrated.log
      - name: Integrated surface audit (shared nonpilot Brain role blocker)
        continue-on-error: true
        run: OUTPOST_NATIVE_MEMBERSHIP_SQL="$RUNNER_TEMP/outpost-membership-159.sql" OUTPOST_NATIVE_SURFACE_AUDIT=1 tests/outpost-native/run.sh | tee /tmp/outpost-native-integrated-surface.log
      - name: Actual local GoTrue session, refresh, logout and revocation
        run: OUTPOST_NATIVE_AUTH=1 tests/outpost-native/run.sh | tee /tmp/outpost-native-auth.log
      - name: Ownership guard mutation must fail its native contracts
        run: |
          if OUTPOST_NATIVE_OMIT_OWNER_GUARD=1 tests/outpost-native/run.sh > /tmp/outpost-native-mutant.log 2>&1; then
            echo '::error::Removing the ownership guard did not fail the native contracts'
            exit 1
          fi
          grep -q 'task mutation and restoration cannot revive.*FAILED' /tmp/outpost-native-mutant.log
          grep -q 'parent capture locks serialize concurrent ownership mutation.*FAILED' /tmp/outpost-native-mutant.log
          echo 'Native mutation caught the missing ownership guard; this is not customer readiness.'
      - name: Public task read guard mutation must fail native API tests
        run: |
          if OUTPOST_NATIVE_OMIT_TASK_READ_GUARD=1 tests/outpost-native/run.sh > /tmp/outpost-native-read-mutant.log 2>&1; then
            echo '::error::Removing public task read protection survived native contracts'
            exit 1
          fi
          grep -q 'viewer task and Brain reads use original authorized principal.*FAILED' /tmp/outpost-native-read-mutant.log
      - name: Public pilot task access acceptance
        id: public-task-readiness
        run: OUTPOST_NATIVE_PUBLIC_AUDIT=1 tests/outpost-native/run.sh | tee /tmp/outpost-native-public-audit.log
      - name: Public task, Brain and membership native audit (known owner blockers)
        id: public-surface-readiness
        continue-on-error: true
        run: OUTPOST_NATIVE_SURFACE_AUDIT=1 tests/outpost-native/run.sh | tee /tmp/outpost-native-surface-audit.log
      - name: Actual pilot handler original-session acceptance
        id: context-readiness
        run: OUTPOST_NATIVE_MEMBERSHIP_SQL="$RUNNER_TEMP/outpost-membership-159.sql" OUTPOST_NATIVE_CONTEXT_AUDIT=1 tests/outpost-native/run.sh | tee /tmp/outpost-native-context-audit.log
      - name: Readiness is separate from identity foundation
        if: always()
        run: |
          echo 'Identity foundation tests are not customer-pilot acceptance. P1–P8 stay disabled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public-task audit outcome: ${{ steps.public-task-readiness.outcome }}. Native persistence, shared permissions and executor/recovery gates remain open.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public-surface audit outcome: ${{ steps.public-surface-readiness.outcome }}. Known public permission failures block Phase 1/customer acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Context-session audit outcome: ${{ steps.context-readiness.outcome }}. Original-session handler integration is a required security gate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outpost-native-identity-proofs
          path: /tmp/outpost-native*.log
          retention-days: 7
